
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="TaskFlow, un gestor de tareas simple y minimalista.">

    <title>TaskFlow | Gestor de tareas</title>

    <!-- Conectamos nuestra hoja de estilos -->
    <link rel="stylesheet" href="style.css">

    <!-- defer hace que el JS se ejecute después de analizar el HTML -->
    <script src="script.js" defer></script>
</head>
<body>

    
<header class="app-header">
    <div>
        <p class="eyebrow">ORGANIZACIÓN PERSONAL</p>
        <h1>TaskFlow<span>.</span></h1>
        <p class="subtitle">Un paso a la vez.</p>
    </div>

    <!-- Botón para cambiar entre modo claro y oscuro -->
    <button
        type="button"
        id="theme-toggle"
        class="theme-toggle"
        aria-label="Activar modo claro"
        title="Cambiar tema"
    >
        ☀️ Modo claro
    </button>
</header>


        <section class="task-section" aria-labelledby="tasks-title">
            <div class="section-heading">
                <h2 id="tasks-title">Mis tareas</h2>
                <span id="task-count">0 tareas pendientes</span>
            </div>

            <!-- Calendario mensual -->
<section class="calendar-section" aria-label="Calendario de tareas">
    <div class="calendar-header">
        <button type="button" id="prev-month" aria-label="Mes anterior">
            &#10094;
        </button>

        <h3 id="calendar-title"></h3>

        <button type="button" id="next-month" aria-label="Mes siguiente">
            &#10095;
        </button>
    </div>

    <p id="selected-date-label"></p>

    <div class="calendar-weekdays" aria-hidden="true">
        <span>Lun</span>
        <span>Mar</span>
        <span>Mié</span>
        <span>Jue</span>
        <span>Vie</span>
        <span>Sáb</span>
        <span>Dom</span>
    </div>

    <div id="calendar-grid" class="calendar-grid"></div>
</section>

            <!-- Formulario para crear nuevas tareas -->
            <form id="task-form">
                <label class="sr-only" for="task-input">
                    Nueva tarea
                </label>

                <input
                    type="text"
                    id="task-input"
                    placeholder="¿Qué necesitás hacer?"
                    maxlength="120"
                    autocomplete="off"
                    required
                >

                <!-- Fecha opcional para organizar la tarea -->
                <label for="task-date" class="sr-only">
                    Fecha de la tarea (opcional)
                </label>

                <input
                    type="date"
                    id="task-date"
                    aria-label="Fecha de la tarea (opcional)"
                >

                <button type="submit" id="add-button">
                    Agregar
                </button>
            </form>

            <!-- Filtros de tareas -->
            <nav class="filters" aria-label="Filtrar tareas">
                <button type="button" class="filter active"
                    data-filter="all" aria-pressed="true">
                    Todas
                </button>

                <button type="button" class="filter"
                    data-filter="pending" aria-pressed="false">
                    Pendientes
                </button>

                <button type="button" class="filter"
                    data-filter="completed" aria-pressed="false">
                    Completadas
                </button>
            </nav>

            <!-- JavaScript insertará las tareas acá -->
            <ul id="task-list" aria-label="Lista de tareas"></ul>

            <p id="empty-message">
                Todavía no hay tareas. Agregá la primera.
            </p>
        </section>

        <footer class="app-footer">
            <p>TaskFlow · Proyecto de portfolio</p>
        </footer>
    </main>

</body>
</html>
